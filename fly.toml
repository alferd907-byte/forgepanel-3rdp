# fly.toml app configuration file generated for forgepanel-3rdp on 2026-11-05T08:45:55Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'forgepanel-3rdp'
primary_region = 'ams'

[build]
  dockerfile = 'deploy/paas/Dockerfile'

[env]
  FORGEPANEL_DATA = '/var/lib/forgepanel'
  FORGEPANEL_PAAS = '1'

[[mounts]]
  source = 'forgepanel_data'
  destination = '/var/lib/forgepanel'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 2000
    soft_limit = 1500

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
